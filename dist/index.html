<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Planetario Star Wars - IG</title>
    <link rel="stylesheet" href="/styles.8986bff4.css">
  <script src="/styles.8986bff4.js"></script></head>
  <body>
    <div id="app"></div>

    <div id="title-banner">
      <h1>SISTEMA GALÁCTICO STAR WARS</h1>
      <p>Práctica de Informática Gráfica — Three.js</p>
    </div>

    <button id="toggle-ui-btn" class="ui-toggle">▲ PANEL DE CONTROL ▲</button>

    <!-- Datapad Horizontal Footer -->
    <div id="ui-panel" class="datapad-footer">
      <div class="datapad-content">
        <div class="control-group">
          <label for="camera-mode">Cámara</label>
          <select id="camera-mode">
            <option value="orbit">Vista General (Órbita)</option>
            <option value="xwing">Vista Nave (X-Wing)</option>
          </select>
        </div>

        <div class="control-group">
          <label for="era-selector">Era Galáctica</label>
          <select id="era-selector">
            <option value="ep4">Episodio IV (Estrella Muerte I)</option>
            <option value="ep6">Episodio VI (Estrella Muerte II)</option>
          </select>
        </div>

        <div class="control-group buttons-container">
          <label>Gestión de Planetas</label>
          <div class="btn-row">
            <button id="toggle-grid">Rejilla</button>
            
            <!-- Selector para restaurar planetas individuales -->
            <select id="restore-select">
              <option value="">-- Restaurar Planeta --</option>
            </select>
            <button id="restore-single-btn">Restaurar</button>
            <button id="reset-planets">Restaurar Todos</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Mini-Barra Flotante Original -->
    <div id="planet-nav" class="nav-overlay hidden">
      <button id="prev-planet-btn" class="nav-btn">&lt;</button>
      
      <div id="planet-summary-bar" class="summary-bar">
        <span id="summary-planet-name">NOMBRE PLANETA</span>
        <div class="summary-buttons">
          <button id="more-info-btn" class="btn-info">Más Info</button>
          <button id="destroy-planet-btn" class="btn-danger">¡DISPARAR ESTRELLA DE LA MUERTE!</button>
          <button id="close-summary-btn" class="btn-close-sm">X</button>
        </div>
      </div>

      <button id="next-planet-btn" class="nav-btn">&gt;</button>
    </div>

    <!-- Panel de Más Info con Flechas Incorporadas (Sin Duplicados) -->
    <div id="planet-info" class="datapad-panel hidden">
      <button id="close-info" class="close-btn">X</button>
    
      <div class="info-navigation-layout" style="display: flex; align-items: center; gap: 10px;">
        <button id="info-prev-btn" class="nav-btn">&lt;</button>
    
        <div class="info-layout" style="flex: 1;">
          <div class="info-content">
            <h2 id="planet-name">Nombre del Planeta</h2>
            <p id="planet-lore">Descripción e información del planeta...</p>
            <div class="info-details" style="margin-bottom: 12px;">
              <span><strong>Región:</strong> <span id="planet-region">-</span></span>
              <span><strong>Clima:</strong> <span id="planet-climate">-</span></span>
            </div>
            <!-- Botón de disparar dentro de la ficha -->
            <button id="info-destroy-btn" class="btn-danger">¡DISPARAR ESTRELLA DE LA MUERTE!</button>
          </div>
    
          <div class="r2d2-container">
            <div id="r2d2-canvas-container"></div>
            <span class="r2d2-label">R2-D2 LOG</span>
          </div>
        </div>
    
        <button id="info-next-btn" class="nav-btn">&gt;</button>
      </div>
    </div>

    <script src="/main.1f19ae8e.js" type="module"></script>
  </body>
</html>
